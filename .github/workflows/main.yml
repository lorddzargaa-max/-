name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder (where package.json is)
        id: loc
        run: |
          F=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$F" ]; then
            echo "package.json not found. Files in repo:"; ls -la; exit 1
          fi
          D=$(dirname "$F")
          echo "Project dir: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          ls -la "$D"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npm install

      - name: Add iOS platform and generate assets
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios

      - name: Build (no code signing)
        working-directory: ${{ steps.loc.outputs.dir }}/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "${{ steps.loc.outputs.dir }}/ios/App/build/App.xcarchive/Products/Applications/App.app" Payload/
          zip -qr JannatAlQuran.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: JannatAlQuran-unsigned-ipa
          path: JannatAlQuran.ipa
