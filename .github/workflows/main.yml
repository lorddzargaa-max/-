name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip if needed
        run: |
          if [ -z "$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)" ]; then
            for z in *.zip; do
              if [ -f "$z" ]; then echo "Unzipping $z"; unzip -oq "$z" -d _app; break; fi
            done
          fi

      - name: Locate project folder
        id: loc
        run: |
          F=$(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$F" ]; then echo "package.json not found"; ls -la; exit 1; fi
          D=$(dirname "$F")
          echo "Project dir: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          ls -la "$D"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare icon and splash (correct sizes)
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          mkdir -p resources
          if [ -f www/icon-maskable-512.png ]; then
            cp www/icon-maskable-512.png resources/icon-only.png
            sips -z 1024 1024 resources/icon-only.png
          fi
          if [ -f resources/splash.png ]; then
            sips --padToHeightWidth 2732 2732 --padColor 1B5642 resources/splash.png
            cp resources/splash.png resources/splash-dark.png
          fi
          ls -la resources

      - name: Install dependencies
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npm install

      - name: Add iOS platform
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npx cap add ios

      - name: Generate icons and splash (continues on failure)
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npx capacitor-assets generate --ios || echo "assets generation skipped"

      - name: Sync web files
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npx cap sync ios

      - name: Build (no code signing)
        working-directory: ${{ steps.loc.outputs.dir }}/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "${{ steps.loc.outputs.dir }}/ios/App/build/App.xcarchive/Products/Applications/App.app" Payload/
          zip -qr JannatAlQuran.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: JannatAlQuran-unsigned-ipa
          path: JannatAlQuran.ipa
